<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do </title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons (eye icon for password toggle) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pt-8 pb-10  rounded-xl border-2 border-black " style="transform: translateY(-20%); background-color: oklch(39.1% 0.09 240.876);">
        <div class="">
            <button 
            id="Dbutton" 
            class="rounded-[999px] text-sm h-11  text-white-500 py-[1px] px-4 text-base m-2 ml-0 "
            >&#x2600</button>
        </div>

        <div class="flex flex-row items-center justify-center gap-[0.6rem]  py-[1.6] px-[0.8]  mb-5" style="background-color: rgb(33, 83, 234);">
            <!--   <input id="" placholder="" value="" type="">  -->
            <input 
                class="h-11 flex-1 min-w-0 p-2 m-2 rounded-lg bg-blue-500" 
                id="todoInput" 
                type="text" 
                placeholder="Enter your task here" > 
            <!---h-11 to both button and input gives them equal height-->
            <button 
                class="h-11 bg-cyan-400 hover:bg-blue-500  text-white-500 py-2 px-6 text-base m-2 " 
                id="createButton">
                Add
            </button>
        </div>

        <div class="mx-auto w-4/5 mt-4" >
            <ul id="ulId"></ul>
        </div>

        <!-- -----------------------------------internal CSS ------------------------------------ -->
        <style>
            .completed{
                color: green;
                font-weight: 600;
                text-decoration: line-through;
            }
            body{
                background-color: white;
                color: black;
                transition: 0.3s;
            }
            body.dark-mode{
                background-color: rgb(39, 37, 37);
                color: rgb(251, 245, 211);
                transition: 0.3s;
            }
            .d-mode-color{
                background-color:white !important;
                color: rgb(39, 37, 37) !important;
                transition: 0.3s !important;
            }
        </style>

        <script>
            //1.taking button element reference
            const createButtonref=document.getElementById('createButton');

            //4.creating input reference
            const todoInputref=document.getElementById('todoInput');

            //6.making ul reference
            const ulRef=document.getElementById('ulId');

            //11.creating dark mode button reference
            const modeButton=document.getElementById('Dbutton');

            //2.for todo app usecase we don't have to remove event listeners so we directly create function
            //3. creating event listener => on clicking call some function (){}
            createButtonref.addEventListener('click',function(){
                const value=todoInputref.value.trim();

                //10.
                if(value===''){ 
                    alert("Write Something")
                    return; //stop execution of function ; if nothing entered
                }
                const li=document.createElement('li');
                
//--        ---------------------------------adding elements inside <li>--------------------------------------                --//
                //span for Task-Text
                const taskText=document.createElement('span');
                taskText.textContent=value;
                //li.appendChild(taskText);
    
                //edit hint
                const editopt=document.createElement("span");
                editopt.classList.add("edit-hint");
                editopt.textContent="✎ dbl-click";
                //li.appendChild(editopt);

//--      ------------------------------Editing span input from input-element-----------------------------------------        --//

                //Editable event listener
                taskText.addEventListener('dblclick',()=>{ //JS event names are Lowercase
                    taskText.contentEditable=true;
                    taskText.focus();
                    //Put the cursor here and make this element active ,without it user may have to click again to edit.
                });

                //save it when user click elsewhere
                taskText.addEventListener('blur',()=>{
                    taskText.contentEditable=false;
                });
                //blur :Remove focus from this element ,The cursor disappears and the element loses focus.
                
                

//--         --------------------------------Adding dlt-btn & Deleting task ---------------------------------------             --//
                //adding delete button
                const dltBtn=document.createElement('button');
                dltBtn.textContent="delete";
                dltBtn.classList.add("delete");
                dltBtn.addEventListener('click',()=>{
                    li.remove();
                });

//--          ------------------------------adding chk-box & Check box for task completion----------------------------------------    --//
                //Radio Button => on span =>    <li><span></span></li>
                const checkRadio=document.createElement('input');
                checkRadio.type="checkbox";
                checkRadio.addEventListener('click',()=>{
                    taskText.classList.toggle('completed');
                });
                

                //appends
                li.appendChild(taskText);
                li.appendChild(editopt);
                li.appendChild(checkRadio);
                li.appendChild(dltBtn);
                ulRef.appendChild(li);
                //The value inside the input box was still their lets remove it after registering task
                todoInputref.value='';

            });
            //optimization for memory saving .for 1000 ,1000000 tasks it has 1 eventlistener or callback function => less memory
            // Event delegation:
            // A single event listener on <ul> handles clicks for all current
            // and future <li> elements, reducing the number of listeners neede
            //9. on clicking any element inside <ul> =>that particular element<li> gets .complete class and if already have the class then .complete is removed.
            // ulRef.addEventListener('click',function(event){
            //     event.target.classList.toggle("completed");
            // });


            //12.Added event listener for darkmode button
            modeButton.addEventListener('click',function(){
                document.body.classList.toggle("dark-mode");
                modeButton.classList.toggle("d-mode-color");
            })

        </script>
    </div>
</body>
</html>
